{% extends "base.html" %}
{% block content %}
<meta name="qairu-slug" content="{{ chat.slug }}">
<div class="card" style="max-width:520px;margin:32px auto">
  <h1 style="font-size:22px">{{ t('w_join_title', title=chat.title) }}</h1>
  <p class="muted small">{{ t('w_join_lead') }}</p>

  {% if members %}
  <p class="small muted">{{ t('w_already_in', count=members|length) }}:</p>
  <ul class="people" style="margin-bottom:14px">
    {% for member in members %}<li class="chip">{{ member.display }}</li>{% endfor %}
  </ul>
  {% endif %}

  <form method="post" action="/g/{{ chat.slug }}/join">
    <div class="field">
      <label for="name">{{ t('w_your_name') }}</label>
      <input id="name" name="name" type="text" required maxlength="60" autofocus
             value="{{ user.display if user else '' }}" placeholder="{{ t('w_your_name_ph') }}">
    </div>
    <button class="btn btn-primary" type="submit">{{ t('w_join_btn') }}</button>
  </form>
</div>
{% endblock %}
